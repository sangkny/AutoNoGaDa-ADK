<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180">
  <rect fill="#f8fafc" width="560" height="180" stroke="#64748b"/>
  <text x="20" y="36" font-family="sans-serif" font-size="16" fill="#0f172a">{title}</text>
  <rect x="40" y="60" width="120" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="100" y="88" font-family="sans-serif" font-size="11" text-anchor="middle">Draft</text>
  <path d="M 160 82 H 200" stroke="#334155" stroke-width="2" marker-end="url(#barr)"/>
  <rect x="200" y="60" width="120" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="260" y="88" font-family="sans-serif" font-size="11" text-anchor="middle">Review</text>
  <path d="M 320 82 H 360" stroke="#334155" stroke-width="2" marker-end="url(#barr)"/>
  <rect x="360" y="60" width="120" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="420" y="88" font-family="sans-serif" font-size="11" text-anchor="middle">Approved</text>
  <text x="280" y="150" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#64748b">{subtitle}</text>
  <defs>
    <marker id="barr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
