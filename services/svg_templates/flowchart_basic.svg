<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <rect fill="#f8fafc" width="480" height="200" stroke="#64748b"/>
  <text x="20" y="36" font-family="sans-serif" font-size="16" fill="#0f172a">{title}</text>
  <rect x="40" y="60" rx="8" ry="8" width="100" height="44" fill="#dbeafe" stroke="#2563eb"/>
  <text x="90" y="88" font-family="sans-serif" font-size="12" text-anchor="middle">START</text>
  <rect x="200" y="60" rx="8" ry="8" width="120" height="44" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="260" y="88" font-family="sans-serif" font-size="12" text-anchor="middle">{process}</text>
  <path d="M 140 82 H 200" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="360" y="60" rx="8" ry="8" width="88" height="44" fill="#dcfce7" stroke="#16a34a"/>
  <text x="404" y="88" font-family="sans-serif" font-size="12" text-anchor="middle">END</text>
  <path d="M 320 82 H 360" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
