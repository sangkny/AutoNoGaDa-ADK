<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240">
  <rect fill="#fafafa" width="480" height="240" stroke="#737373"/>
  <text x="20" y="30" font-family="sans-serif" font-size="15" fill="#171717">{title}</text>
  <rect x="180" y="48" rx="8" ry="8" width="120" height="36" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="240" y="72" font-family="sans-serif" font-size="12" text-anchor="middle">{init}</text>
  <path d="M 240 84 V 100" stroke="#404040" stroke-width="2" marker-end="url(#lar)"/>
  <polygon points="240,140 280,120 240,100 200,120" fill="#fef9c3" stroke="#a16207"/>
  <text x="240" y="124" font-family="sans-serif" font-size="11" text-anchor="middle">{condition}</text>
  <rect x="320" y="108" rx="8" ry="8" width="120" height="40" fill="#dcfce7" stroke="#15803d"/>
  <text x="380" y="134" font-family="sans-serif" font-size="11" text-anchor="middle">{body}</text>
  <path d="M 280 120 H 320" stroke="#404040" stroke-width="2" marker-end="url(#lar)"/>
  <path d="M 380 148 V 200 H 100 V 120 H 198" stroke="#404040" stroke-width="2" fill="none" marker-end="url(#lar)"/>
  <rect x="156" y="168" rx="8" ry="8" width="168" height="36" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="240" y="190" font-family="sans-serif" font-size="12" text-anchor="middle">{exit_step}</text>
  <defs>
    <marker id="lar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#404040"/>
    </marker>
