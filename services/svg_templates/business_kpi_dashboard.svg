<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <rect fill="#f8fafc" width="520" height="200" stroke="#64748b"/>
  <text x="20" y="30" font-family="sans-serif" font-size="15" fill="#0f172a">{title}</text>
  <rect x="24" y="48" width="140" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="94" y="76" font-family="sans-serif" font-size="11" text-anchor="middle">{kpi_a}</text>
  <text x="94" y="94" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e40af">{kpi_a_value}</text>
  <rect x="190" y="48" width="140" height="56" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="260" y="76" font-family="sans-serif" font-size="11" text-anchor="middle">{kpi_b}</text>
  <text x="260" y="94" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#047857">{kpi_b_value}</text>
  <rect x="356" y="48" width="140" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="426" y="76" font-family="sans-serif" font-size="11" text-anchor="middle">{kpi_c}</text>
  <text x="426" y="94" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#b45309">{kpi_c_value}</text>
  <rect x="24" y="120" width="472" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <polyline points="48,168 120,140 200,152 280,128 360,144 440,132" fill="none" stroke="#6366f1" stroke-width="3"/>
  <text x="260" y="176" font-family="sans-serif" font-size="11" text-anchor="middle">{trend_caption}</text>
</svg>
