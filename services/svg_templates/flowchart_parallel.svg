  <path d="M 260 92 V 110" stroke="#334155" stroke-width="2" marker-end="url(#far)"/>
  <rect x="60" y="118" rx="8" ry="8" width="140" height="44" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="130" y="146" font-family="sans-serif" font-size="12" text-anchor="middle">{branch_a}</text>
